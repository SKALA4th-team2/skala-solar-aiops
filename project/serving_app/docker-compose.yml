services:
  serving-app:
    build:
      context: ..
      dockerfile: serving_app/Dockerfile
    ports: ["127.0.0.1:8099:8099"]
    volumes:
      - solar-runtime:/runtime
      - solar-uploads:/app/data/uploads
      - solar-logs:/app/logs
    environment:
      SOLAR_STATE_DIR: /runtime
      EXECUTION_UNIT: container
      SOLAR_DEMO_MODE: ${SOLAR_DEMO_MODE:-0}
volumes:
  solar-runtime:
  solar-uploads:
  solar-logs:
