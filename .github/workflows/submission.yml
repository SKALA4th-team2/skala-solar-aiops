name: Submission Docker verification
on:
  push:
    branches: [main, final]
    paths:
      - 'project/**'
      - 'tools/hourly/**'
      - 'tools/submission/**'
      - 'datasets/multi_plant/raw/**'
      - 'datasets/plant_forecasts/raw/**'
      - '.github/workflows/submission.yml'
  pull_request:
    paths:
      - 'project/**'
      - 'tools/hourly/**'
      - 'tools/submission/**'
      - '.github/workflows/submission.yml'
  workflow_dispatch:
    inputs:
      retrain:
        description: "Recreate seeds from original sources instead of verifying committed models"
        type: boolean
        required: false
        default: false
permissions:
  contents: read
  actions: read
jobs:
  docker-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: project
    env:
      TF_ENABLE_ONEDNN_OPTS: '0'
      TF_CPP_MIN_LOG_LEVEL: '3'
      MLFLOW_DISABLE_AGENT_HINT: '1'
      HOURLY_EVIDENCE_DIR: ${{ github.workspace }}/project/submission/training-evidence
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install training dependencies
        if: inputs.retrain == true
        run: python -m pip install -r requirements-training.txt
      - name: Recreate hourly data and models from original sources
        if: inputs.retrain == true
        run: |
          python ../tools/hourly/prepare.py
          python ../tools/hourly/train.py --workers 2
          python ../tools/hourly/finalize.py
      - name: Verify approved seed integrity and package optional backup
        run: |
          python ../tools/submission/check_seed.py
          python ../tools/submission/package_models.py
      - name: Verify incentive boundary cases
        run: |
          python ../tools/submission/test_incentives.py
          python -m pip install "numpy<3" "pydantic>=2,<3"
          python ../tools/submission/test_review_regressions.py
      - name: Build and start actual Docker container
        run: |
          mkdir -p submission/docker-evidence
          docker version > submission/docker-evidence/docker-version.txt
          docker compose -f serving_app/docker-compose.yml build 2>&1 | tee submission/docker-evidence/build.log
          SOLAR_DEMO_MODE=1 docker compose -f serving_app/docker-compose.yml up -d
      - name: Exercise 31 models and native automatic retraining over HTTP
        run: python ../tools/submission/exercise_http.py --base http://127.0.0.1:8099 --out submission/docker-evidence
      - name: Restart container and verify persisted prediction
        run: |
          docker compose -f serving_app/docker-compose.yml restart
          python ../tools/submission/exercise_http.py --base http://127.0.0.1:8099 --out submission/docker-evidence --check-existing
          docker compose -f serving_app/docker-compose.yml ps --format json > submission/docker-evidence/compose-ps.json
          curl --fail http://127.0.0.1:8099/openapi.json > submission/docker-evidence/openapi.json
          curl --fail http://127.0.0.1:8099/docs > submission/docker-evidence/swagger.html
      - name: Capture container logs
        if: always()
        run: |
          docker compose -f serving_app/docker-compose.yml logs --no-color > submission/docker-evidence/container.log 2>&1 || true
          docker compose -f serving_app/docker-compose.yml cp serving-app:/app/logs submission/docker-evidence/runtime-logs || true
      - name: Upload reproducible model bundle and measured evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: solar-hourly-submission-${{ github.sha }}
          path: |
            project/submission/solar-hourly-seed.zip
            project/submission/solar-hourly-seed.zip.manifest.json
            project/submission/docker-evidence/
            project/submission/training-evidence/summary.json
          retention-days: 30
      - name: Stop test container
        if: always()
        run: docker compose -f serving_app/docker-compose.yml down
